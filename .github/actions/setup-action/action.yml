name: 'Setup Action'
description: 'Install the patched Node.js runtime and locked pnpm dependencies'
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      name: Install pnpm
      with:
        version: 7.32.4
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Verify Node.js runtime
      shell: bash
      run: node -e "console.log(process.version); require('node:assert/strict').equal(process.version, 'v22.23.4')"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # actions/cache restores .nx/cache from other runners; Nx rejects those by
    # default (machine ID mismatch). Allow reuse since this is intentional CI caching.
    # https://nx.dev/troubleshooting/unknown-local-cache
    - name: Allow restored Nx local cache
      shell: bash
      run: echo "NX_REJECT_UNKNOWN_LOCAL_CACHE=0" >> "$GITHUB_ENV"

    - name: Cache nx cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .nx/cache
        key: ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'nx.json', '**/project.json') }}
